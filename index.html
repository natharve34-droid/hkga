<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<title>Christmas Golf Organiser</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛳</text></svg>">
<style>
/* Layout: one column of cards under a sticky green tab bar with a candy-stripe edge; widens to two columns on desktop */
:root{
  --green:#0f3d2e; --green2:#174f3c; --green3:#1b5b45; --green-ink:#0f3d2e; --green-soft:#e5efe8;
  --red:#b3122e; --red-ink:#b3122e; --red-soft:#fbe8eb; --red-line:#efc3cb;
  --gold:#c99a2e; --gold-soft:#f6ecd2; --gold-ink:#7a5a10;
  --bg:#f7f4ec; --card:#ffffff; --field:#ffffff; --field-line:#d6d0c1; --ink:#17241e; --muted:#5b6a63; --line:#e3ddcf; --head:#f3efe4; --grey-soft:#efede6;
  --amber:#8a6200; --amber-soft:#fbf0cc; --note-ink:#5b4300; --maybe-line:#ecd38a;
  --yes-bg:#d5eedc; --yes-fg:#12693a; --yes-line:#a7d6b5; --no-bg:#f9dde1; --no-line:#eeb4be;
  --win:#fdf6e3; --best:#fdf2d4; --on-accent:#ffffff; --tab-ink:#cfe0d6; --shade:rgba(0,0,0,.12); --scrim:rgba(10,20,16,.55);
  --radius:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --green:#124633; --green2:#0f3a2b; --green3:#185a43; --green-ink:#8fd1ae; --green-soft:#1c3a2e;
  --red:#c42a45; --red-ink:#ff8a9b; --red-soft:#3a1a20; --red-line:#6a2a35;
  --gold:#d9ad45; --gold-soft:#3a2f12; --gold-ink:#f1c75b;
  --bg:#0e1714; --card:#15211c; --field:#1b2a24; --field-line:#36493f; --ink:#e8efe9; --muted:#9db0a6; --line:#2a3a33; --head:#1d2b25; --grey-soft:#25332d;
  --amber:#f1c75b; --amber-soft:#3a3016; --note-ink:#f1d48a; --maybe-line:#6b5420;
  --yes-bg:#1c3d2a; --yes-fg:#8fe0aa; --yes-line:#2f6a46; --no-bg:#40191f; --no-line:#7a2e3a;
  --win:#2e2814; --best:#2c2612; --on-accent:#ffffff; --tab-ink:#b9d3c4; --shade:rgba(0,0,0,.4); --scrim:rgba(0,0,0,.65);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --green:#124633; --green2:#0f3a2b; --green3:#185a43; --green-ink:#8fd1ae; --green-soft:#1c3a2e;
  --red:#c42a45; --red-ink:#ff8a9b; --red-soft:#3a1a20; --red-line:#6a2a35;
  --gold:#d9ad45; --gold-soft:#3a2f12; --gold-ink:#f1c75b;
  --bg:#0e1714; --card:#15211c; --field:#1b2a24; --field-line:#36493f; --ink:#e8efe9; --muted:#9db0a6; --line:#2a3a33; --head:#1d2b25; --grey-soft:#25332d;
  --amber:#f1c75b; --amber-soft:#3a3016; --note-ink:#f1d48a; --maybe-line:#6b5420;
  --yes-bg:#1c3d2a; --yes-fg:#8fe0aa; --yes-line:#2f6a46; --no-bg:#40191f; --no-line:#7a2e3a;
  --win:#2e2814; --best:#2c2612; --on-accent:#ffffff; --tab-ink:#b9d3c4; --shade:rgba(0,0,0,.4); --scrim:rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--green2)}
button{font:inherit}
:focus-visible{outline:2px solid var(--green-ink);outline-offset:2px}
.top{background:var(--green);color:var(--on-accent);padding-block:14px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:repeating-linear-gradient(135deg,var(--red) 0 10px,var(--on-accent) 10px 20px)}
.top .wrap{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:20px;flex:none}
.brand{font-weight:700;font-size:17px;line-height:1.2;min-width:0}
.brand small{display:block;font-weight:400;opacity:.75;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.saved{margin-left:auto;font-size:12px;opacity:.8;white-space:nowrap}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--green2);box-shadow:0 2px 8px var(--shade)}
.tabs .wrap{max-width:980px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tabs .wrap::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;background:none;border:0;color:var(--tab-ink);padding:12px 12px 10px;font-weight:600;font-size:14px;border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:var(--on-accent);border-bottom-color:var(--red)}
main{max-width:980px;margin:0 auto;padding-block:16px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;min-width:0}
h2{font-size:20px;margin:0 0 4px;color:var(--green-ink);text-wrap:balance}
h3{font-size:16px;margin:0 0 10px;color:var(--green-ink)}
h4{font-size:12.5px;margin:14px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
p{margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:13px}
.grid2{display:grid;gap:14px;grid-template-columns:1fr}
.grid2>.card{margin-bottom:0}
.grid2+.card,.grid2+.grid2{margin-top:14px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
label.f>input,label.f>select,label.f>textarea{display:block;width:100%;margin-top:4px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--field-line);border-radius:10px;padding:9px 11px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green-ink);outline-offset:0;border-color:var(--green-ink)}
textarea{resize:vertical;min-height:70px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--green);color:var(--on-accent);white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.1)}
.btn.red{background:var(--red)}
.btn.ghost{background:var(--field);color:var(--ink);border-color:var(--field-line)}
.btn.danger{background:var(--field);color:var(--red-ink);border-color:var(--red-line)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default;filter:none}
.icon-btn{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:6px 8px;border-radius:8px;line-height:1}
.icon-btn:hover{background:var(--red-soft);color:var(--red-ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--green-soft);color:var(--green-ink);font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.red{background:var(--red-soft);color:var(--red-ink)}
.chip.gold{background:var(--gold-soft);color:var(--gold-ink)}
.chip.grey{background:var(--grey-soft);color:var(--muted)}
.banner{background:var(--red-soft);border:1px solid var(--red-line);color:var(--red-ink);border-radius:12px;padding:10px 12px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.info{background:var(--green-soft);border-color:var(--yes-line);color:var(--green-ink)}
.note{background:var(--amber-soft);color:var(--note-ink);border-radius:10px;padding:9px 12px;font-size:13.5px;margin:10px 0}
.note.green{background:var(--green-soft);color:var(--green-ink)}
.empty{text-align:center;color:var(--muted);padding:18px 8px}
/* hero */
.hero{background:linear-gradient(135deg,var(--green) 0%,var(--green3) 100%);color:var(--on-accent);border:0;position:relative;overflow:hidden}
.hero::before{content:"❄";position:absolute;right:14px;top:4px;font-size:70px;opacity:.08}
.hero h2{color:var(--on-accent);font-size:22px}
.hero .muted{color:var(--tab-ink)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;min-width:0}
.stat span{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;opacity:.75}
.stat b{display:block;font-size:16px;margin-top:2px;font-variant-numeric:tabular-nums}
.stat small{opacity:.8;display:block}
.stats.light .stat{background:var(--head);color:var(--ink)}
.stats.light .stat span{color:var(--muted);opacity:1}
.steps{list-style:none;margin:0;padding:0}
.steps li{border-bottom:1px solid var(--line)}
.steps li:last-child{border:0}
.steps button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:flex-start;padding:9px 2px;width:100%;box-sizing:border-box}
.steps button:focus-visible{outline:2px solid var(--green-ink)}
.steps button::after{content:"›";margin-left:auto;color:var(--muted);font-size:18px;line-height:1}
.steps .dot{width:8px;height:8px;border-radius:50%;background:var(--red);margin-top:7px;flex:none}
/* tables */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th{background:var(--head);font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pos{font-weight:700;color:var(--muted);width:34px}
tr.win td{background:var(--win)}
tr.win .pos{color:var(--gold)}
/* players */
.prow{display:grid;gap:8px;grid-template-columns:1fr 84px auto;grid-template-areas:"name hcp del" "phone st st" "ph ph ph";padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.prow:last-child{border-bottom:0}
.prow .n{grid-area:name}.prow .h{grid-area:hcp}.prow .t{grid-area:phone}.prow .ph{grid-area:ph}.prow .d{grid-area:del}.prow .st{grid-area:st}
@media(min-width:760px){.prow{grid-template-columns:1.4fr 90px 1fr 128px 170px auto;grid-template-areas:"name hcp phone st ph del"}}
.ph{font-size:13px;color:var(--muted);line-height:1.25}
.ph b{color:var(--green-ink);font-size:16px}
.status{border:1px solid;border-radius:999px;padding:8px 12px;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
.status.confirmed,.status.paid{background:var(--yes-bg);color:var(--yes-fg);border-color:var(--yes-line)}
.status.unsure{background:var(--amber-soft);color:var(--amber);border-color:var(--maybe-line)}
.status.unpaid{background:var(--field);color:var(--muted);border-color:var(--field-line)}
.addrow{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.addrow>:first-child{grid-column:1/-1}
.addrow .btn{grid-column:1/-1}
@media(min-width:760px){.addrow{grid-template-columns:1.4fr 130px 1fr auto}.addrow>:first-child,.addrow .btn{grid-column:auto}}
/* availability */
.av{width:46px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--field);cursor:pointer;font-weight:800;font-size:15px;color:var(--muted)}
.av.yes{background:var(--yes-bg);color:var(--yes-fg);border-color:var(--yes-line)}
.av.maybe{background:var(--amber-soft);color:var(--amber);border-color:var(--maybe-line)}
.av.no{background:var(--no-bg);color:var(--red-ink);border-color:var(--no-line)}
.avt th,.avt td{text-align:center;padding:6px}
.avt th:first-child,.avt td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;min-width:110px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avt th:first-child{background:var(--head)}
.avt th.best,.avt td.best{background:var(--best)}
.avt tfoot td{font-weight:700;color:var(--green-ink);background:var(--head)}
.avt tfoot td:first-child{background:var(--head)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px;align-items:center}
.legend .av{width:30px;height:26px;font-size:12px;cursor:default}
.rank{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rank:last-child{border:0}
.rank .rn{width:26px;height:26px;border-radius:50%;background:var(--head);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted);flex:none}
.rank.best .rn{background:var(--gold);color:var(--on-accent)}
.rank .rd{font-weight:700;min-width:110px}
.bar{height:6px;border-radius:3px;background:var(--line);flex:1 1 80px;min-width:60px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green-ink)}
.rank.best .bar i{background:var(--gold)}
/* formats */
.seg{display:inline-flex;background:var(--head);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--field);color:var(--green-ink);box-shadow:0 1px 3px var(--shade)}
.fgrid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:760px){.fgrid{grid-template-columns:1fr 1fr}}
.fcard{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card);display:flex;flex-direction:column;gap:8px;min-width:0}
.fcard.rec{border-color:var(--yes-line)}
.fcard.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.fcard h3{margin:0;font-size:16px}
.fcard .why{font-size:13px;color:var(--green-ink);font-style:italic}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin:2px 0 4px}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600}
.fcard .btn{align-self:flex-start;margin-top:auto}
/* teams & groups */
.tgrid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:620px){.tgrid{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.tgrid.three{grid-template-columns:1fr 1fr 1fr}}
.tcard{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);min-width:0}
.tcard .thead{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.tcard .thead input{flex:1;font-weight:700;color:var(--green-ink)}
.member{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.member .nm{flex:1;min-width:0}
.member .nm small{display:block;color:var(--muted)}
.member select{font-size:14px;padding:5px 6px;max-width:130px}
.gtime{font-size:20px;font-weight:800;color:var(--green-ink);font-variant-numeric:tabular-nums}
.tee-badge{font-size:12px;font-weight:700;background:var(--red);color:var(--on-accent);border-radius:6px;padding:2px 7px}
/* scores */
.sc-in{width:64px;text-align:center;padding:7px 4px}
.lb-title{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.trophy{color:var(--gold)}
/* side comps */
.side-grid{display:grid;gap:8px;grid-template-columns:90px 1fr}
.side-grid label.f{margin:0}
.side-grid .full{grid-column:1/-1}
@media(min-width:760px){.side-grid{grid-template-columns:90px 1fr 1fr}.side-grid .full{grid-column:1/-1}}
.suggest{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;background:var(--green-soft);color:var(--green-ink);padding:8px 10px;border-radius:10px;margin-top:8px}
/* money */
.money-in{display:flex;align-items:center;gap:6px}
.money-in input{width:100%}
.prize-row{display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:center;padding:6px 0}
.tot{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.tot b{font-variant-numeric:tabular-nums}
.ok{color:var(--yes-fg)}.bad{color:var(--red-ink)}
/* toast & dialog */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.dlg{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:70;padding:16px}
.dlg-box{background:var(--card);color:var(--ink);border-radius:16px;padding:20px;max-width:420px;width:100%;box-shadow:0 10px 40px var(--shade)}
.dlg-box p{font-size:15.5px;margin-bottom:16px}
/* print / share view */
#printView{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:40;padding-top:env(safe-area-inset-top,0px)}
#printView .pv{max-width:820px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pv-head{text-align:center;border-bottom:3px double var(--red);padding-bottom:12px;margin-bottom:16px}
.pv-head h1{margin:0;color:var(--green-ink);font-size:24px;text-wrap:balance}
.pv section{margin-bottom:18px;break-inside:avoid}
.pv h2{border-bottom:1px solid var(--line);padding-bottom:4px}
.pv-bar{position:sticky;top:0;background:var(--bg);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;z-index:2}
.share-box{width:100%;min-height:160px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
@media print{
  body{background:#fff}
  body::before{display:none}
  body>header,body>nav,body>main,#toast,.pv-bar{display:none!important}
  #printView{position:static;background:#fff;overflow:visible}
  #printView .pv{padding:0}
  .table-wrap{overflow:visible;border:0}
  th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="logo" aria-hidden="true">🎄</div>
  <div class="brand">Christmas Golf<small id="hdrName"></small></div>
  <div class="saved" id="saved">Saved</div>
</div></header>
<nav class="tabs" aria-label="Sections"><div class="wrap" id="tabs"></div></nav>
<main id="main"></main>
<div id="printView" hidden></div>
<div id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<div id="dlg" class="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="dlgMsg"><div class="dlg-box"><p id="dlgMsg"></p><div class="row end"><button class="btn ghost" id="dlgNo" type="button">Cancel</button><button class="btn red" id="dlgYes" type="button">OK</button></div></div></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
const parseHcp = v => { const n = parseFloat(String(v).trim().replace(',', '.')); return isNaN(n) ? null : Math.round(n * 10) / 10; };
const fmtH = h => (h < 0 ? '+' + Math.abs(h).toFixed(1) : Number(h).toFixed(1));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmtNum = v => (Math.round(v * 10) / 10).toString();
function isoToDate(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }

/* ---------- lookups ---------- */
const P = id => S.players.find(p => p.id === id);
const T = id => S.teams.find(t => t.id === id);
const curFormat = () => FMAP[S.format.id] || null;
const is2x9 = () => { const f = curFormat(); return !!(f && (f.forces2x9 || S.format.mode === '2x9')); };
const isTeamFormat = () => { const f = curFormat(); return !!f && f.unit !== 'individual'; };
const teamOf = pid => S.teams.find(t => t.playerIds.includes(pid));
const teamPlayers = t => t.playerIds.map(P).filter(Boolean);
const sc = id => S.scores[id] || {};
const avgH = ids => { const ps = ids.map(P).filter(Boolean); return ps.length ? ps.reduce((a, p) => a + p.hcp, 0) / ps.length : 0; };

function weightsFor(f, size){ return f.weights ? (f.weights[size] || f.weights[f.teamSize] || null) : null; }
/* playing handicap for one player under the chosen format (back = back-9 allowance for combo) */
function playerPH(p, back){
  const f = curFormat();
  if (!f) return null;
  if (f.pct) return Math.round(p.hcp * (back && f.pctBack ? f.pctBack : f.pct));
  const t = teamOf(p.id); if (!t) return null;
  const sorted = teamPlayers(t).sort((a, b) => a.hcp - b.hcp);
  const w = weightsFor(f, sorted.length); if (!w) return null;
  return Math.round(p.hcp * w[sorted.findIndex(x => x.id === p.id)] * 10) / 10;
}
function teamHcp(t){
  const f = curFormat(); if (!f || !f.weights) return null;
  const sorted = teamPlayers(t).sort((a, b) => a.hcp - b.hcp);
  const w = weightsFor(f, sorted.length); if (!w) return null;
  return Math.round(sorted.reduce((a, p, i) => a + p.hcp * (w[i] || 0), 0));
}
function phExplain(p){
  const f = curFormat();
  if (!f) return {val:'—', text:'Choose a format'};
  if (f.pct){
    const a = playerPH(p);
    if (f.pctBack) return {val:`${a} / ${playerPH(p, true)}`, text:`95% front · 85% back of ${fmtH(p.hcp)}`};
    return {val:a, text:`${Math.round(f.pct * 100)}% of ${fmtH(p.hcp)} = ${a}`};
  }
  const t = teamOf(p.id);
  if (!t) return {val:'—', text:'Team-based allowance — generate teams'};
  const sorted = teamPlayers(t).sort((a, b) => a.hcp - b.hcp);
  const w = weightsFor(f, sorted.length); const i = sorted.findIndex(x => x.id === p.id);
  return {val:fmtNum(playerPH(p)), text:`${Math.round(w[i] * 100)}% share → team hcp ${teamHcp(t)}`};
}
const phShort = p => { const f = curFormat(); if (!f) return fmtH(p.hcp); const v = playerPH(p); return v == null ? fmtH(p.hcp) : (f.pctBack ? `${v}/${playerPH(p, true)}` : fmtNum(v)); };
/* label for member lines: team-allowance formats show the player's share of the team handicap */
const phLabel = p => { const f = curFormat(); return f && f.weights && playerPH(p) != null ? `share ${fmtNum(playerPH(p))}` : `PH ${phShort(p)}`; };
/* print sheet: playing hcp for individual allowances, handicap index for team allowances */
const phPrint = p => { const f = curFormat(); return f && f.weights ? fmtH(p.hcp) : phShort(p); };

/* ---------- dates ---------- */
function rankDates(){
  return S.dates.map(d => {
    let yes = 0, maybe = 0, no = 0;
    S.players.forEach(p => { const v = (S.availability[p.id] || {})[d.id]; if (v === 'yes') yes++; else if (v === 'maybe') maybe++; else if (v === 'no') no++; });
    return {...d, yes, maybe, no, score: yes * 2 + maybe};
  }).sort((a, b) => b.score - a.score || a.no - b.no || a.date.localeCompare(b.date));
}
const noAvail = () => S.players.filter(p => !S.dates.some(d => (S.availability[p.id] || {})[d.id]));

/* ---------- formats ---------- */
function recommend(n){

    ['stableford', 'Best all-rounder for a small group — everyone plays their own game and a bad hole won\'t wreck the card.'],
    ['medal', 'For the purists: every shot counts, simple to score.'],

}
function roundTime(f){
  const gs = +S.tee.groupSize, n = S.players.length, G = Math.max(1, Math.ceil(n / gs));
  const per = f.mins - (gs === 3 ? 15 : 0);
  const waves = S.tee.start === 'two' ? Math.ceil(G / 2) : G;
  return {per, G, field: per + (waves - 1) * S.tee.interval};
}

/* ---------- teams ---------- */
function genTeams(){
  const f = curFormat(); const n = S.players.length;
  const k = f.teamSize === 2 ? Math.max(1, Math.floor(n / 2)) : Math.max(1, Math.ceil(n / 4));
  const buckets = snake([...S.players].sort((a, b) => a.hcp - b.hcp), k);
  const names = shuffle(FESTIVE);
  S.teams = buckets.map((b, i) => ({id:uid(), name:names[i % names.length] + (i >= names.length ? ' ' + (Math.floor(i / names.length) + 1) : ''), playerIds:b.map(p => p.id)}));
  S.teamsSize = f.teamSize;
}

/* ---------- groups / tee times ---------- */
function genGroups(){
  const gs = +S.tee.groupSize, m = S.tee.method;
  const byH = (a, b) => a.hcp - b.hcp;
  let groups;
  const teamMode = isTeamFormat() && S.teams.some(t => t.playerIds.length);
  if (teamMode){
    let units = S.teams.filter(t => t.playerIds.length).map(t => ({ids:[...t.playerIds], h:avgH(t.playerIds)}));
    const taken = new Set(units.flatMap(u => u.ids));
    S.players.filter(p => !taken.has(p.id)).forEach(p => units.push({ids:[p.id], h:p.hcp}));
    if (m === 'random') units = shuffle(units);
    else {
      units.sort((a, b) => a.h - b.h);
      if (m === 'mixed'){ const o = []; let i = 0, j = units.length - 1; while (i <= j){ o.push(units[i++]); if (i <= j) o.push(units[j--]); } units = o; }
    }
    groups = [];
    for (const u of units){
      let g = m === 'similar'
        ? (groups.length && groups[groups.length - 1].length + u.ids.length <= gs ? groups[groups.length - 1] : null)
        : groups.find(g => g.length + u.ids.length <= gs);
      if (!g){ g = []; groups.push(g); }
      g.push(...u.ids);
    }
  } else {
    const ps = [...S.players]; const G = Math.max(1, Math.ceil(ps.length / gs));
    if (!ps.length) groups = [];
    else if (m === 'mixed') groups = snake(ps.sort(byH), G).map(b => b.map(p => p.id));
    else groups = chunkBalanced((m === 'random' ? shuffle(ps) : ps.sort(byH)).map(p => p.id), G);
  }
  S.groups = groups.filter(g => g.length).map(ids => ({id:uid(), playerIds:ids}));
}
function teeRows(){
  const G = S.groups.length, two = S.tee.start === 'two', half = Math.ceil(G / 2);
  return S.groups.map((g, i) => {
    const second = two && i >= half;
    return {g, i, tee: second ? 10 : 1, time: addMins(S.tournament.teeTime || '09:00', (second ? i - half : i) * S.tee.interval)};
  });
}
const ungrouped = () => { const s = new Set(S.groups.flatMap(g => g.playerIds)); return S.players.filter(p => !s.has(p.id)); };

/* ---------- scoring ---------- */
function entities(){
  const f = curFormat(); if (!f) return [];
  if (f.unit === 'individual') return S.players.map(p => ({id:p.id, name:p.name, sub:`Hcp ${fmtH(p.hcp)} · PH ${playerPH(p)}`, ph:playerPH(p)}));
  return S.teams.filter(t => t.playerIds.length).map(t => {
    const th = teamHcp(t);
    return {id:t.id, name:t.name, sub:teamPlayers(t).map(p => p.name).join(', ') + (th != null ? ` · team hcp ${th}` : ''), ph:th};
  });
}
function boards(){
  const f = curFormat(); if (!f) return [];
  const pts = f.scoring === 'points';
  const cmp = (a, b) => (pts ? b.v - a.v : a.v - b.v) || (pts ? b.cb - a.cb : a.cb - b.cb);
  const mk = (title, rows) => ({title, pts, rows:rows.filter(r => r.v != null).sort(cmp), missing:rows.filter(r => r.v == null)});
  if (f.id === 'combo'){
    const front = S.players.map(p => ({id:p.id, name:p.name, sub:'', v:num(sc(p.id).f9), cb:0, detail:''}));
    const back = S.teams.filter(t => t.playerIds.length).map(t => ({id:t.id, name:t.name, sub:teamPlayers(t).map(p => p.name).join(', '), v:num(sc(t.id).b9), cb:0, detail:''}));
    const overall = S.players.map(p => {
      const t = teamOf(p.id), a = num(sc(p.id).f9), b = t ? num(sc(t.id).b9) : null;
      return {id:p.id, name:p.name, sub:t ? t.name : 'no pair', v:(a != null && b != null) ? a + b : null, cb:b ?? 0, detail:`F9 ${a ?? '–'} · B9 ${b ?? '–'}`};
    });
    return [mk('Front 9 — individual', front), mk('Back 9 — pairs', back), mk('Overall', overall)];
  }
  const rows = entities().map(e => {
    const s = sc(e.id), f9 = num(s.f9), b9 = num(s.b9), ph = e.ph || 0;
    const ff = f9 == null ? null : (pts ? f9 : f9 - ph / 2);
    const bb = b9 == null ? null : (pts ? b9 : b9 - ph / 2);
    const tot = (ff != null && bb != null) ? ff + bb : null;
    const gross = (f9 != null && b9 != null) ? f9 + b9 : null;
    return {id:e.id, name:e.name, sub:e.sub, f9, b9, ff, bb, gross, tot};
  });
  const det = r => pts ? `F9 ${r.f9 ?? '–'} · B9 ${r.b9 ?? '–'}` : `gross ${r.gross ?? '–'} (${r.f9 ?? '–'}/${r.b9 ?? '–'})`;
  const overall = mk('Overall', rows.map(r => ({...r, v:r.tot, cb:r.bb ?? 0, detail:det(r)})));
  if (!is2x9()) return [overall];
  return [
    mk('Front 9', rows.map(r => ({...r, v:r.ff, cb:0, detail:pts ? '' : `gross ${r.f9 ?? '–'}`}))),
    mk('Back 9', rows.map(r => ({...r, v:r.bb, cb:0, detail:pts ? '' : `gross ${r.b9 ?? '–'}`}))),
    overall];
}
const fmtVal = (b, v) => b.pts ? `${fmtNum(v)} pts` : `net ${fmtNum(v)}`;
function positions(rows){
  // shared position only when both total and countback tie
  let pos = 0; return rows.map((r, i) => { if (i === 0 || r.v !== rows[i - 1].v || r.cb !== rows[i - 1].cb) pos = i + 1; return pos; });
}
function boobySuggestion(){
  const b = boards(); if (!b.length) return null;
  const o = b[b.length - 1]; if (!o.rows.length) return null;
  return o.rows[o.rows.length - 1];
}

/* ---------- money ---------- */
const fmtMoney = v => (v < 0 ? '−' : '') + (S.money.currency || '') + (Number.isInteger(Math.round(Math.abs(v) * 100) / 100) ? Math.abs(Math.round(v)) : Math.abs(v).toFixed(2));
const confirmed = () => S.players.filter(p => p.status === 'confirmed');
function moneyCalc(){
  const m = S.money, conf = confirmed().length, all = S.players.length;
  const n = m.basis === 'all' ? all : conf;
  const cost = num(m.courseCost) || 0, charge = num(m.charge) || 0;
  const allocated = m.prizes.reduce((a, r) => a + (num(r.amount) || 0), 0);
  const payers = (m.basis === 'all' ? S.players : confirmed());
  const paidN = payers.filter(p => m.paid[p.id]).length;
  return {conf, all, n, cost, charge, set: num(m.courseCost) != null && num(m.charge) != null,
    collected: charge * n, courseTotal: cost * n, pool: (charge - cost) * n, perHead: charge - cost,
    allocated, paidN, payers, inHand: paidN * charge};
}
function suggestSplit(){
  const c = moneyCalc(); const pool = Math.max(0, Math.floor(c.pool));
  const sides = S.sideComps.filter(x => x.type !== 'booby');
  const sideEach = sides.length ? Math.floor(pool * 0.1) : 0;
  const rest = pool - sideEach * sides.length;
  const parts = [['Winner', .5], ['Runner-up', .3], ['3rd place', .2]].map(([label, p]) => ({label, amount: Math.floor(rest * p)}));
  parts[0].amount += rest - parts.reduce((a, r) => a + r.amount, 0);
  return [...parts, ...sides.map(x => ({label:x.name, amount:sideEach}))].map(r => ({id:uid(), label:r.label, amount:String(r.amount)}));
}

/* ---------- next steps ---------- */
function nextSteps(){

  if (n < 2) out.push({tab:'players', text:`Add players (${n} so far)`});
  const uns = S.players.filter(p => p.status !== 'confirmed');

  const na = noAvail();
  if (na.length) out.push({tab:'dates', text:`${na.length} player${na.length > 1 ? 's haven\'t' : ' hasn\'t'} given availability (${na.map(p => esc(p.name.split(' ')[0])).join(', ')})`});
  if (!S.tournament.date){ const best = rankDates()[0]; out.push({tab:'dates', text:`Choose the date${best && best.score ? ` — best so far: ${fmtDate(best.date)}` : ''}`}); }
  if (!f) out.push({tab:'format', text:'Choose a format'});
  if (f && f.unit !== 'individual'){
    const unassigned = S.players.filter(p => !teamOf(p.id));
    if (!S.teams.length || S.teamsSize !== f.teamSize) out.push({tab:'teams', text:`Generate ${f.teamSize === 2 ? 'pairs' : 'teams of 4'}`});
    else if (unassigned.length) out.push({tab:'teams', text:`${unassigned.length} player(s) not in a team`});
  }
  if (!S.tournament.teeTime) out.push({tab:'tee', text:'Set the first tee time'});
  if (n && !S.groups.length) out.push({tab:'tee', text:'Generate the tee sheet'});
  else if (ungrouped().length) out.push({tab:'tee', text:`${ungrouped().length} player(s) not on the tee sheet`});
  const mc = moneyCalc();
  if (!mc.set) out.push({tab:'money', text:'Set the course cost and entry charge per player'});
  else {
    if (mc.perHead < 0) out.push({tab:'money', text:`Entry charge doesn't cover the course cost (${fmtMoney(mc.perHead)} each)`});
    const unpaid = mc.payers.length - mc.paidN;
    if (unpaid > 0) out.push({tab:'money', text:`${unpaid} player${unpaid > 1 ? 's' : ''} still to pay (${fmtMoney(unpaid * mc.charge)})`});
    if (mc.allocated > mc.pool + 0.001) out.push({tab:'money', text:`Prize split is ${fmtMoney(mc.allocated - mc.pool)} over the pool`});
  }
  const noHole = S.sideComps.filter(c => c.type !== 'booby' && !c.hole);
  if (noHole.length) out.push({tab:'side', text:`Set holes for ${noHole.map(c => esc(c.name)).join(', ')}`});
  if (f){
    const b = boards(), o = b[b.length - 1];
    if (o && o.rows.length && o.missing.length) out.push({tab:'scores', text:`${o.missing.length} score(s) still to enter`});
  }
  return out;
}

function boardTable(b, limit){
  if (!b.rows.length) return `<p class="muted small">No scores yet.</p>`;
  const pos = positions(b.rows);
  const rows = (limit ? b.rows.slice(0, limit) : b.rows);
  return `<div class="table-wrap"><table><tbody>${rows.map((r, i) => `
    <tr class="${pos[i] === 1 ? 'win' : ''}"><td class="pos">${pos[i] === 1 ? '🏆' : pos[i]}</td>
    <td><b>${esc(r.name)}</b>${r.sub ? `<div class="small muted">${esc(r.sub)}</div>` : ''}</td>
    <td class="num"><b>${fmtVal(b, r.v)}</b>${r.detail ? `<div class="small muted">${esc(r.detail)}</div>` : ''}</td></tr>`).join('')}
  </tbody></table></div>`;
}

function fmtCard(f, why){
  const rt = roundTime(f), sel = S.format.id === f.id, n = S.players.length;
  let units = '';
  if (f.unit === 'pairs') units = ` · ${Math.floor(n / 2)} pair${Math.floor(n / 2) === 1 ? '' : 's'}${n % 2 ? ' (one trio)' : ''}`;
  if (f.unit === 'teams'){ const k = Math.ceil(n / 4); units = ` · ${k} team${k === 1 ? '' : 's'}${n % 4 ? ' (some of 3)' : ''}`; }
  return `<article class="fcard ${sel ? 'sel' : why ? 'rec' : ''}">
    <div class="row"><h3>${esc(f.name)}</h3>${sel ? '<span class="chip red">✓ Selected</span>' : why ? '<span class="chip">★ Recommended</span>' : ''}</div>
    ${why ? `<div class="why">${esc(why)}</div>` : ''}
    <div class="small">${esc(f.how)}</div>
    <dl class="facts">
      <dt>Play</dt><dd>${UNIT_LABEL[f.unit]}${n ? units : ''}</dd>
      <dt>Scoring</dt><dd>${f.scoring === 'points' ? 'Stableford points (highest wins)' : 'Strokes, net (lowest wins)'}</dd>
      <dt>Allowance</dt><dd>${esc(f.allowance)}</dd>
      <dt>Groups</dt><dd>${rt.G} × ${S.tee.groupSize}-ball${S.tee.start === 'two' ? ', two-tee start' : ''}</dd>
      <dt>Round time</dt><dd>~${fmtDur(rt.per)} per group · field done ~${fmtDur(rt.field)} after first tee</dd>
    </dl>
    ${sel ? `<button class="btn ghost sm" data-act="useFormat" data-id="">Clear selection</button>` : `<button class="btn ${why ? 'red' : ''} sm" data-act="useFormat" data-id="${f.id}">Use this format</button>`}
  </article>`;
}

  const stale = S.teams.length && S.teamsSize !== f.teamSize;
  const unassigned = S.players.filter(p => !teamOf(p.id));
  const moveSel = p => `<select data-ch="moveTeam" data-pid="${p.id}" aria-label="Move ${esc(p.name)}"><option value="">Move to…</option>${S.teams.filter(t => !t.playerIds.includes(p.id)).map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}${teamOf(p.id) ? '<option value="__none">Unassigned</option>' : ''}</select>`;

      <button class="btn ghost" data-act="addTeam">＋ Add empty team</button>

      <div class="thead"><input id="tm-${t.id}" data-field="team:${t.id}:name" value="${esc(t.name)}" aria-label="Team name"><button class="icon-btn" data-act="delTeam" data-id="${t.id}" aria-label="Delete team">✕</button></div>
      <div class="row small muted" style="margin-bottom:6px">Avg hcp ${ps.length ? avgH(t.playerIds).toFixed(1) : '—'}${th != null ? ` · <b style="color:var(--green)">Team hcp ${th}</b>` : ''}</div>
      ${ps.map(p => `<div class="member"><span class="nm">${esc(p.name)}<small>Hcp ${fmtH(p.hcp)} · ${phLabel(p)}</small></span>${moveSel(p)}</div>`).join('') || '<div class="small muted">Empty team</div>'}
    </div>`;}).join('')}</div>` : ''}
  ${unassigned.length ? `<section class="card" style="margin-top:14px"><h3>Unassigned (${unassigned.length})</h3>${unassigned.map(p => `<div class="member"><span class="nm">${esc(p.name)}<small>Hcp ${fmtH(p.hcp)}</small></span>${moveSel(p)}</div>`).join('')}</section>` : ''}`;

    return `<div class="member"><span class="nm">${esc(p.name)}<small>Hcp ${fmtH(p.hcp)} · ${phLabel(p)}${t ? ' · ' + esc(t.name) : ''}</small></span>${moveSel(p, gid)}</div>`; };
  const opt = (v, cur, label) => `<option value="${v}" ${String(cur) === String(v) ? 'selected' : ''}>${label}</option>`;
  return `
  <section class="card"><h2>Tee times</h2>

function scoreInput(id, k, label){

function vScores(){

  const pts = f.scoring === 'points';

    entry = `<h4>Front 9 — individual Stableford points</h4>

      ${S.players.map(p => `<tr><td><b>${esc(p.name)}</b><div class="small muted">PH ${playerPH(p)} (9 holes: ~${Math.round(playerPH(p) / 2)})</div></td><td class="num">${scoreInput(p.id, 'f9', p.name + ' front 9')}</td></tr>`).join('')}

      <div class="stat"><span>Prize pool</span><b class="${c.pool < 0 ? 'bad' : 'ok'}">${fmtMoney(c.pool)}</b><small class="muted">${fmtMoney(c.perHead)} per player</small></div>

    ${need != null ? `<div class="suggest">With ${c.n} players and a course cost of ${fmtMoney(c.cost)}: charge <b>${fmtMoney(need)}</b> each → pool ${fmtMoney((need - c.cost) * c.n)}

    ${b.some(x => x.rows.length) ? `<section><h2>Results</h2>${b.map(x => `<h4>${esc(x.title)}</h4>${boardTable(x)}`).join('')}</section>` : ''}

      ${S.money.prizes.length ? `<div class="table-wrap"><table><tbody>${S.money.prizes.map(r => `<tr><td>${esc(r.label)}</td><td class="num">${fmtMoney(num(r.amount) || 0)}</td></tr>`).join('')}</tbody></table></div>` : ''}</section>` : ''}
    <section><h2>Side competitions</h2><div class="table-wrap"><table><thead><tr><th>Comp</th><th>Hole</th><th>Winner</th><th>Prize</th></tr></thead><tbody>

function shareText(){
  const t = S.tournament, f = curFormat(), L = [];
  L.push(`🎄⛳ ${t.name}`);
  if (t.venue) L.push(`📍 ${t.venue}`);
  if (t.date) L.push(`📅 ${fmtDate(t.date, true)}${t.teeTime ? ', first tee ' + t.teeTime : ''}`);
  if (f) L.push(`🏌️ ${f.name}${is2x9() ? ' (2 × 9)' : ''}`);
  const mc = moneyCalc();
  if (mc.set) L.push(`💷 Entry ${fmtMoney(mc.charge)} each (${fmtMoney(mc.cost)} green fee) · prize pool ${fmtMoney(mc.pool)}`);
  if (S.groups.length){ L.push('', 'TEE SHEET'); teeRows().forEach(r => L.push(`${r.time} (tee ${r.tee}): ${r.g.playerIds.map(P).filter(Boolean).map(p => p.name).join(', ')}`)); }
  boards().filter(x => x.rows.length).forEach(x => { L.push('', x.title.toUpperCase()); const pos = positions(x.rows); x.rows.forEach((r, i) => L.push(`${pos[i]}. ${r.name} – ${fmtVal(x, r.v)}`)); });
  const won = S.sideComps.filter(c => c.winner);
  if (won.length){ L.push('', 'SIDE COMPS'); won.forEach(c => L.push(`${c.name}: ${winnerName(c.winner)}${c.prize ? ' (' + c.prize + ')' : ''}`)); }
  return L.join('\n');
}

/* ---------- render ---------- */
const VIEWS = {overview:vOverview, players:vPlayers, dates:vDates, format:vFormat, teams:vTeams, tee:vTee, scores:vScores, side:vSide, money:vMoney};
function render(){
  const a = document.activeElement, fid = a && a.id;
  let sel = null; try { if (a && a.selectionStart != null) sel = [a.selectionStart, a.selectionEnd]; } catch (e) {}
  const scrolls = {}; document.querySelectorAll('.table-wrap[id]').forEach(w => scrolls[w.id] = w.scrollLeft);
  $('#tabs').innerHTML = TABS.map(([k, l]) => `<button class="${k === tab ? 'on' : ''}" data-act="tab" data-tab="${k}" ${k === tab ? 'aria-current="page"' : ''}>${l}</button>`).join('');
  $('#hdrName').textContent = S.tournament.name || '';
  document.title = (S.tournament.name || 'Christmas Golf') + ' ⛳';
  if (SY.mode === 'loading') return;
  $('#main').innerHTML = (SY.readOnly ? '<div class="banner info">👀 You can view this tournament. To make changes, ask the organiser to invite you as an Editor.</div>' : '') + (SY.mode === 'shared' && !SY.mainExists && !S.players.length ? '<div class="banner info">🎄 This shared tournament is empty. Add players, load the example data, or import a backup from the Overview tab.</div>' : '') + VIEWS[tab]();
  for (const id in scrolls){ const w = document.getElementById(id); if (w) w.scrollLeft = scrolls[id]; }
  if (fid){ const el = document.getElementById(fid); if (el){ el.focus({preventScroll:true}); try { if (sel) el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
  if (!$('#printView').hidden) $('#printView').innerHTML = printHTML();
}
function commit(){
  if (SY.mode === 'shared' && SY.readOnly){ S = fromSent(); render(); toast('View only — ask the organiser to invite you as an Editor'); return; }
  save(); render();
}
function go(t){
  tab = t; history.replaceState(null, '', '#' + t); render(); window.scrollTo(0, 0);
  const on = document.querySelector('#tabs .on'); if (on) on.scrollIntoView({inline:'nearest', block:'nearest'});
}

/* ---------- actions ---------- */
function removePlayer(id){
  S.players = S.players.filter(p => p.id !== id);
  S.teams.forEach(t => t.playerIds = t.playerIds.filter(x => x !== id));
  S.groups.forEach(g => g.playerIds = g.playerIds.filter(x => x !== id));
  S.groups = S.groups.filter(g => g.playerIds.length);
  delete S.availability[id]; delete S.scores[id]; delete S.money.paid[id];
  S.sideComps.forEach(c => { if (c.winner === id) c.winner = ''; });
  S.dates.forEach(d => { if (d.suggestedBy === id) d.suggestedBy = ''; });
}
const ACT = {
  tab: el => go(el.dataset.tab),
  delPlayer: async el => { const p = P(el.dataset.id); if (p && (await ask(`Remove ${p.name}? Their availability, team spot and scores will be removed too.`))){ removePlayer(p.id); commit(); toast(`${p.name} removed`); } },
  cycleAv: el => {
    const {pid, did} = el.dataset, a = S.availability[pid] || (S.availability[pid] = {});
    const order = ['', 'yes', 'maybe', 'no'], nx = order[(order.indexOf(a[did] || '') + 1) % 4];
    if (nx) a[did] = nx; else delete a[did];
    commit();
  },
  chooseDate: el => { const d = S.dates.find(x => x.id === el.dataset.id); S.tournament.date = d.date; commit(); toast(`Date set: ${fmtDate(d.date, true)}`); },
  delDate: async el => {
    const d = S.dates.find(x => x.id === el.dataset.id); if (!(await ask(`Delete ${fmtDate(d.date)} from the candidate dates?`))) return;
    S.dates = S.dates.filter(x => x !== d); Object.values(S.availability).forEach(a => delete a[d.id]); commit();
  },
  setMode: el => { S.format.mode = el.dataset.mode; commit(); },
  useFormat: el => {
    S.format.id = el.dataset.id; const f = curFormat(); commit();
    toast(f ? `Format: ${f.name}` : 'Format cleared');
  },
  genTeams: async () => {
    const hasScores = S.teams.some(t => S.scores[t.id] && (S.scores[t.id].f9 || S.scores[t.id].b9));
    if (S.teams.length && !(await ask(hasScores ? 'Regenerate teams? Team scores already entered will be lost.' : 'Replace the current teams with a new balanced draw?'))) return;
    S.teams.forEach(t => delete S.scores[t.id]);
    genTeams(); commit(); toast('Teams generated — balanced by handicap');
  },
  addTeam: () => { const used = new Set(S.teams.map(t => t.name)); S.teams.push({id:uid(), name:FESTIVE.find(n => !used.has(n)) || `Team ${S.teams.length + 1}`, playerIds:[]}); if (!S.teamsSize) S.teamsSize = curFormat().teamSize; commit(); },
  delTeam: async el => { const t = T(el.dataset.id); if (!(await ask(`Delete ${t.name}? Its players become unassigned.`))) return; S.teams = S.teams.filter(x => x !== t); delete S.scores[t.id]; commit(); },
  genGroups: () => { genGroups(); commit(); toast('Tee sheet generated'); },
  delSide: async el => { const c = S.sideComps.find(x => x.id === el.dataset.id); if (!(await ask(`Delete ${c.name}?`))) return; S.sideComps = S.sideComps.filter(x => x !== c); commit(); },
  useBooby: el => { S.sideComps.find(x => x.id === el.dataset.id).winner = el.dataset.w; commit(); },
  exportData: async () => {
    const filename = `christmas-golf-${new Date().toISOString().slice(0, 10)}.json`;
    if (FRAMED){
      const dl = await window.claude.use('downloads').catch(() => null);
      if (!dl){ toast('Downloads aren\'t available here'); return; }
      try { await dl.save({filename, data:JSON.stringify(S, null, 2)}); toast('Backup saved'); }
      catch (e) { if (e && e.code !== 'declined') toast('Couldn\'t save the backup: ' + (e.message || e.code)); }
      return;
    }
    const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Backup downloaded');
  },
  importData: () => $('#importFile').click(),
  printView: () => { const pv = $('#printView'); pv.hidden = false; pv.innerHTML = printHTML(); pv.scrollTop = 0; document.body.style.overflow = 'hidden'; },
  closePrint: () => { $('#printView').hidden = true; document.body.style.overflow = ''; },
  doPrint: () => window.print(),
  share: async () => {
    const text = shareText();
    if (!FRAMED && navigator.share){ try { await navigator.share({title:S.tournament.name, text}); return; } catch (e) { if (e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(text); toast('Copied — paste it into WhatsApp'); }
    catch (e) { const box = $('#shareBox'); box.hidden = false; box.value = text; box.focus(); box.select(); toast('Select the text below and copy it'); }
  },
  clearExample: async () => {
    if (!(await ask('Clear the example players, scores and settings and start fresh?'))) return;
    S = blank(); commit(); go('overview'); toast('Example data cleared');
  },
  resetAll: async () => {
    if (!(await ask('Delete EVERYTHING and start over? (Export a backup first if unsure.)'))) return;
    S = blank(); commit(); go('overview'); toast('Started over');
  },
  toggleStatus: el => { const p = P(el.dataset.id); p.status = p.status === 'confirmed' ? 'unsure' : 'confirmed'; commit(); },
  confirmAll: () => { S.players.forEach(p => p.status = 'confirmed'); commit(); toast('Everyone marked as confirmed'); },
  togglePaid: el => { const id = el.dataset.id; if (S.money.paid[id]) delete S.money.paid[id]; else S.money.paid[id] = true; commit(); },
  moneyBasis: el => { S.money.basis = el.dataset.v; commit(); },
  useCharge: el => { S.money.charge = el.dataset.v; commit(); toast(`Charge set to ${fmtMoney(+el.dataset.v)}`); },
  addPrize: () => { S.money.prizes.push({id:uid(), label:'', amount:''}); commit(); const r = S.money.prizes[S.money.prizes.length - 1]; const el = document.getElementById('mp-l-' + r.id); if (el) el.focus(); },
  delPrize: el => { S.money.prizes = S.money.prizes.filter(r => r.id !== el.dataset.id); commit(); },
  suggestSplit: async () => { if (S.money.prizes.length && !(await ask('Replace the current prize split with a suggested one?'))) return; S.money.prizes = suggestSplit(); commit(); },
  saveCloud: () => {
    let url = $('#cl-url').value.trim().replace(/\/+$/, ''), key = $('#cl-key').value.trim();
    if (url && !/^https?:\/\//.test(url)) url = 'https://' + url;
    if (!/^https:\/\/[^\s/]+$/.test(url) || key.length < 20){ toast('Paste the project URL and the publishable key from Supabase'); return; }
    setCloudCfg({url, key}); render(); toast('Connected — now put the tournament online');
  },
  forgetCloud: () => { setCloudCfg(null); render(); },
  goOnline: async () => { if (await ask('Upload this tournament and create a live link for the players?', 'Go online')) goOnline(); },
  copyLink: async () => { const el = $('#shareLink'); try { await navigator.clipboard.writeText(el.value); toast('Link copied — paste it into the group chat'); } catch (e) { el.focus(); el.select(); toast('Select the link and copy it'); } },
  leaveOnline: async () => {
    if (SY.mode === 'shared' && !(await ask('Stop using the live version on this device? You\'ll see this device\'s own saved copy instead. The live tournament stays online and you can reopen the link any time.', 'Use this device only'))) return;
    location.href = location.pathname + location.hash;
  },
  loadExample: async () => { if (!(await ask('Replace all current data with the example tournament?'))) return; S = seed(); commit(); toast('Example data loaded'); },
};
const CH = {
  moveTeam: el => {
    const pid = el.dataset.pid, to = el.value; if (!to) return;
    S.teams.forEach(t => t.playerIds = t.playerIds.filter(x => x !== pid));
    if (to !== '__none') T(to).playerIds.push(pid);
    commit();
  },
  moveGroup: el => {
    const pid = el.dataset.pid, to = el.value; if (!to) return;
    S.groups.forEach(g => g.playerIds = g.playerIds.filter(x => x !== pid));
    if (to === '__new') S.groups.push({id:uid(), playerIds:[pid]});
    else S.groups.find(g => g.id === to).playerIds.push(pid);
    S.groups = S.groups.filter(g => g.playerIds.length);
    commit();
  },
  teeSet: el => { const k = el.dataset.k; S.tee[k] = (k === 'interval' || k === 'groupSize') ? +el.value : el.value; commit(); },
  sideWinner: el => { S.sideComps.find(x => x.id === el.dataset.id).winner = el.value; commit(); },
};
/* text fields: update state as you type (no re-render), re-render on change */
function setField(el){
  const [kind, id, key] = el.dataset.field.split(':'), v = el.value;
  if (kind === 't') S.tournament[id] = v;
  else if (kind === 'p'){ const p = P(id); if (!p) return; if (key === 'hcp'){ const h = parseHcp(v); if (h != null) p.hcp = h; } else if (key === 'name'){ if (v.trim()) p.name = v; } else p[key] = v; }
  else if (kind === 'team'){ const t = T(id); if (t) t.name = v; }
  else if (kind === 'sc'){ const s = S.scores[id] || (S.scores[id] = {}); s[key] = v.replace(/[^0-9.\-]/g, ''); }
  else if (kind === 'side'){ const c = S.sideComps.find(x => x.id === id); if (c) c[key] = v; }
  else if (kind === 'm') S.money[id] = id === 'currency' ? v : v.replace(/[^0-9.]/g, '');
  else if (kind === 'mp'){ const r = S.money.prizes.find(x => x.id === id); if (r) r[key] = key === 'amount' ? v.replace(/[^0-9.]/g, '') : v; }
  save();
}
const FORM = {
  addPlayer: () => {
    const name = $('#new-name').value.trim(), h = parseHcp($('#new-hcp').value);
    if (!name){ toast('Enter a name'); $('#new-name').focus(); return; }
    if (h == null || h > 54 || h < -10){ toast('Enter a handicap, e.g. 14.2'); $('#new-hcp').focus(); return; }
    S.players.push({id:uid(), name, hcp:h, phone:$('#new-phone').value.trim(), status:'unsure'});
    commit(); $('#new-name').focus(); toast(`${name} added`);
  },
  addDate: () => {
    const d = $('#nd-date').value; if (!d){ toast('Pick a date'); return; }
    if (S.dates.some(x => x.date === d)){ toast('That date is already listed'); return; }
    S.dates.push({id:uid(), date:d, suggestedBy:$('#nd-by').value}); commit(); toast(`${fmtDate(d)} added`);
  },
  addSide: () => {
    const name = $('#ns-name').value.trim(); if (!name){ toast('Enter a name'); return; }
    S.sideComps.push({id:uid(), name, type:'custom', hole:'', winner:'', prize:'', notes:''}); commit();
  },
};

document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && !el.disabled){ e.preventDefault(); ACT[el.dataset.act](el, e); } });
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.field) setField(e.target); });
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.field){ setField(el); setTimeout(SY.readOnly ? commit : render, 0); return; }
  if (el.dataset.ch) CH[el.dataset.ch](el);
});
document.addEventListener('submit', e => { const f = e.target.dataset.form; if (f){ e.preventDefault(); FORM[f](); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if (!$('#dlg').hidden) closeDlg(false); else if (!$('#printView').hidden) ACT.closePrint(); } });
$('#dlgYes').addEventListener('click', () => closeDlg(true));
$('#dlgNo').addEventListener('click', () => closeDlg(false));
$('#dlg').addEventListener('click', e => { if (e.target.id === 'dlg') closeDlg(false); });
$('#importFile').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.players)) throw new Error('not a backup');
      if (!(await ask(`Import "${(d.tournament || {}).name || 'tournament'}" with ${d.players.length} players? This replaces the current data.`))) return;
      S = normalize(d); commit(); toast('Data imported');
    } catch (err) { toast('That file doesn\'t look like a Christmas Golf backup.'); }
    e.target.value = '';
  };
  r.readAsText(file);
});
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (VIEWS[t] && t !== tab){ tab = t; render(); } });
window.addEventListener('storage', e => { if (SY.mode === 'local' && e.key === STORE){ S = load(); render(); } });

/* ---------- online mode (Supabase) ----------
   One table, public.docs (t, path, data), one row per piece of state:
     main/<key>       each top-level setting (players, teams, groups, money…)
     avail/<playerId> one player's availability, so people can fill their rows at the same time
     scores/<id>      one player's or team's scores, so groups can enter scores at the same time
   data = {v: "<json>"}; data = null marks a deleted row. The tournament id (t) in the link is the secret. */
const FRAMED = !!(window.claude && typeof window.claude.use === 'function');
const MAIN_KEYS = ['version','isExample','tournament','players','dates','format','teams','teamsSize','tee','groups','sideComps','money'];
const CLOUD_KEY = 'xmasGolf.cloud';
const SUPABASE_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js';
/* Built-in project for this site. The publishable key is meant to be public (it's limited by the table's row-level security). */
const BUILTIN_CLOUD = {url:'https://xqzrexjoknhpjzqaqxgl.supabase.co', key:'sb_publishable_gShAv-NEolff8JO7M1fcqw_elnZ5RK1'};
const SY = {mode:'local', client:null, tid:'', readOnly:false, mainExists:false, loaded:false, timer:null, retry:null, chain:Promise.resolve(), sent:{main:{}, avail:{}, scores:{}}};
const jMain = k => JSON.stringify(S[k] ?? null);
const jAvail = id => (S.availability[id] && Object.keys(S.availability[id]).length) ? JSON.stringify(S.availability[id]) : undefined;
const jScore = id => { const x = S.scores[id]; return (x && (x.f9 || x.b9)) ? JSON.stringify({f9:x.f9 || '', b9:x.b9 || ''}) : undefined; };
const COLLS = [['avail', 'availability', jAvail], ['scores', 'scores', jScore]];

function cloudCfg(){ try { const c = JSON.parse(localStorage.getItem(CLOUD_KEY) || 'null'); if (c && c.url && c.key) return c; } catch (e) {} return BUILTIN_CLOUD.url && BUILTIN_CLOUD.key ? BUILTIN_CLOUD : null; }
const isBuiltin = c => !!c && c.url === BUILTIN_CLOUD.url && c.key === BUILTIN_CLOUD.key;
function setCloudCfg(c){ try { if (c) localStorage.setItem(CLOUD_KEY, JSON.stringify(c)); else localStorage.removeItem(CLOUD_KEY); } catch (e) {} }
function shareLink(){
  const c = cloudCfg(); if (!c || !SY.tid) return '';
  return `${location.origin}${location.pathname}?t=${SY.tid}` + (isBuiltin(c) ? '' : `&c=${encodeURIComponent(btoa(c.url + '|' + c.key))}`);
}
function fromSent(){
  const s = blank();
  MAIN_KEYS.forEach(k => { if (SY.sent.main[k] !== undefined) s[k] = JSON.parse(SY.sent.main[k]); });
  s.availability = {}; for (const id in SY.sent.avail) s.availability[id] = JSON.parse(SY.sent.avail[id]);
  s.scores = {}; for (const id in SY.sent.scores) s.scores[id] = JSON.parse(SY.sent.scores[id]);
  return normalize(s);
}
function scheduleSync(){
  setStatus('Syncing…');
  clearTimeout(SY.timer); clearTimeout(SY.retry);
  SY.timer = setTimeout(() => { SY.timer = null; SY.chain = SY.chain.then(pushChanges).catch(onSyncError); }, 400);
}
/* rows that differ from what the server last confirmed */
function changedRows(){
  const rows = [], now = new Date().toISOString();
  MAIN_KEYS.forEach(k => { const j = jMain(k); if (j !== SY.sent.main[k]) rows.push({sent:['main', k, j], row:{t:SY.tid, path:'main/' + k, data:{v:j}, updated_at:now}}); });
  for (const [coll, target, ser] of COLLS){
    const sent = SY.sent[coll];
    for (const id of new Set([...Object.keys(S[target]), ...Object.keys(sent)])){
      const j = ser(id); if (j === sent[id]) continue;
      rows.push({sent:[coll, id, j], row:{t:SY.tid, path:coll + '/' + id, data:j === undefined ? null : {v:j}, updated_at:now}});
    }
  }
  return rows;
}
async function pushChanges(){
  const rows = changedRows();
  if (rows.length){
    const {error} = await SY.client.from('docs').upsert(rows.map(r => r.row));
    if (error) throw error;
    rows.forEach(({sent:[c, k, j]}) => { if (j === undefined) delete SY.sent[c][k]; else SY.sent[c][k] = j; });
  }
  if (!SY.timer) setStatus('Live ✓');
}
function onSyncError(e){
  setStatus('Not synced — retrying');
  toast('Couldn\'t save that online yet (no signal?). It will keep trying.');
  console.warn('sync error', e);
  SY.retry = setTimeout(() => { SY.chain = SY.chain.then(pushChanges).catch(onSyncError); }, 8000);
}
/* apply one server row unless this device has an unsent edit to the same piece */
function applyRow(row){
  const i = row.path.indexOf('/'), coll = row.path.slice(0, i), key = row.path.slice(i + 1);
  const j = row.data && typeof row.data.v === 'string' ? row.data.v : undefined;
  if (coll === 'main'){
    if (!MAIN_KEYS.includes(key) || j === undefined) return;
    SY.mainExists = true;
    if (jMain(key) !== SY.sent.main[key]) return;
    SY.sent.main[key] = j; S[key] = JSON.parse(j);
    return;
  }
  const c = COLLS.find(x => x[0] === coll); if (!c) return;
  const [, target, ser] = c;
  if (ser(key) !== SY.sent[coll][key]) return;
  if (j === undefined){ delete SY.sent[coll][key]; delete S[target][key]; }
  else { SY.sent[coll][key] = j; S[target][key] = JSON.parse(j); }
}
function applyRemote(fn){
  const snap = () => JSON.stringify([S.availability, S.scores, MAIN_KEYS.map(jMain)]);
  const before = snap(); fn();
  if (SY.loaded && snap() !== before){ S = normalize(S); render(); }
}
function loadSupabase(){
  if (window.supabase && window.supabase.createClient) return Promise.resolve();
  return new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = SUPABASE_JS; sc.onload = res; sc.onerror = () => rej(new Error('Couldn\'t load the Supabase library — check your internet connection.')); document.head.appendChild(sc); });
}
function makeClient(c){ return window.supabase.createClient(c.url, c.key, {auth:{persistSession:false, autoRefreshToken:false}}); }
async function refetch(){
  const {data, error} = await SY.client.from('docs').select('path,data').eq('t', SY.tid);
  if (error) throw error;
  applyRemote(() => data.forEach(applyRow));
}
function loadingCard(msg, retry){
  $('#tabs').innerHTML = '';
  $('#main').innerHTML = `<section class="card"><div class="empty">${msg}${retry ? `<br><br><button class="btn" onclick="location.reload()">Try again</button> <button class="btn ghost" data-act="leaveOnline">Use this device only</button>` : ''}</div></section>`;
}
function startLocal(){ SY.mode = 'local'; S = load(); save(); render(); }
async function startOnline(tid){
  SY.mode = 'loading'; SY.tid = tid;
  setStatus('Connecting…'); loadingCard('Loading the live tournament…');
  const cfg = cloudCfg();
  if (!cfg){ loadingCard('This link is missing the online settings. Ask the organiser to send the full link again.', true); return; }
  try { await loadSupabase(); } catch (e) { loadingCard(esc(e.message), true); return; }
  SY.client = makeClient(cfg);
  S = blank(); S.availability = {}; S.scores = {};
  SY.sent = {main:{}, avail:{}, scores:{}}; MAIN_KEYS.forEach(k => SY.sent.main[k] = jMain(k));
  let wasDown = false;
  SY.client.channel('t-' + tid)
    .on('postgres_changes', {event:'*', schema:'public', table:'docs', filter:'t=eq.' + tid}, p => { if (p.new && p.new.path) applyRemote(() => applyRow(p.new)); })
    .subscribe(status => {
      if (status === 'SUBSCRIBED'){ if (wasDown && SY.loaded) refetch().catch(() => {}); wasDown = false; if (SY.loaded && !SY.timer) setStatus('Live ✓'); }
      else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED'){ wasDown = true; if (SY.loaded) setStatus('Reconnecting…'); }
    });
  try {
    const {data, error} = await SY.client.from('docs').select('path,data').eq('t', tid);
    if (error) throw error;
    data.forEach(applyRow);
  } catch (e) {
    loadingCard(`Couldn't reach the online tournament.<br><span class="small">${esc(e.message || String(e))}</span>`, true); return;
  }
  SY.loaded = true; SY.mode = 'shared';
  S = normalize(S); render(); setStatus('Live ✓');
  // phones sleep between shots: catch up whenever the app comes back to the front
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refetch().catch(() => {}); });
}
/* put the current device's tournament online under a new secret id, then reopen it from the server */
async function goOnline(){
  const cfg = cloudCfg(); if (!cfg) return;
  setStatus('Uploading…');
  try {
    await loadSupabase();
    SY.client = makeClient(cfg);
    const bytes = new Uint8Array(12); crypto.getRandomValues(bytes);
    SY.tid = Array.from(bytes, b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join('');
    SY.sent = {main:{}, avail:{}, scores:{}};
    const rows = changedRows().map(r => r.row);
    const {error} = await SY.client.from('docs').upsert(rows);
    if (error) throw error;
    location.href = `${location.pathname}?t=${SY.tid}${location.hash}`;
  } catch (e) {
    SY.tid = ''; setStatus('Saved ✓');
    toast('Couldn\'t go online: ' + (e.message || e) + '. Check the URL and key, and that you ran the setup SQL.');
  }
}
function vOnline(){
  const c = cloudCfg();
  if (SY.mode === 'shared'){
    const link = shareLink();
    return `<section class="card"><h3>🟢 Live online</h3>
      <p class="small muted">Everyone with this link sees changes as they happen. Send it to the players (it's the only key to this tournament, so only share it with the group).</p>
      ${location.protocol === 'file:' ? '<div class="note">You\'re running the file from your computer, so this link only works on this PC. Put the file on the web (e.g. GitHub Pages) and open it from there to get a link players can use.</div>' : ''}
      <input id="shareLink" value="${esc(link)}" readonly style="width:100%;font-size:13px" aria-label="Link for players">
      <div class="row" style="margin-top:8px"><button class="btn" data-act="copyLink">Copy link</button><button class="btn ghost sm" data-act="leaveOnline">Use this device only</button></div>
    </section>`;
  }
  if (!c) return `<section class="card"><h3>Play online</h3>
    <p class="small muted">Connect a free Supabase project so players can open one link and see availability, tee times and scores live on their phones.</p>
    <label class="f">Supabase project URL<input id="cl-url" placeholder="https://abcdefgh.supabase.co" autocomplete="off" spellcheck="false"></label>
    <label class="f">Publishable (anon) key<input id="cl-key" placeholder="sb_publishable_… or eyJ…" autocomplete="off" spellcheck="false"></label>
    <button class="btn" data-act="saveCloud">Connect</button></section>`;
  return `<section class="card"><h3>Play online</h3>
    <p class="small muted">${isBuiltin(c) ? 'Ready to go live.' : `Connected to <b>${esc(c.url.replace(/^https?:\/\//, ''))}</b>.`} Put this tournament online to get a link for the players. Your current data is uploaded as the starting point.</p>
    <div class="row"><button class="btn red" data-act="goOnline">Put this tournament online</button>${isBuiltin(c) ? '' : '<button class="btn ghost sm" data-act="forgetCloud">Use the built-in project</button>'}</div></section>`;
}

/* links can carry the project settings (c=) so players need no setup; store them and tidy the address bar */
(function init(){
  const q = new URLSearchParams(location.search);
  if (q.get('c')){
    try { const [url, key] = atob(q.get('c')).split('|'); if (url && key) setCloudCfg({url, key}); } catch (e) {}
    q.delete('c'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + location.hash);
  }
  const tid = q.get('t');
  if (tid && /^[a-z0-9]{10,40}$/.test(tid)) startOnline(tid); else startLocal();
})();
</script>
